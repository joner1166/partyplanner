<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logolindo.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Original Lindo Michoacán – Event Booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Prata&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Netlify Forms detection — DO NOT REMOVE.
      Netlify scans this file at build time to register the form endpoint.
      After deploying, go to: Site Settings → Forms → Notifications
      and add desertinn@lindomichoacan.com as the email recipient.
    -->
    <form name="party-booking" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="party-booking" />
      <input name="bot-field" />
      <input name="first-name" />
      <input name="last-name" />
      <input name="phone" />
      <input name="email" />
      <input name="comments" />
      <input name="service" />
      <input name="guests" />
      <input name="date" />
      <input name="time" />
      <input name="period" />
      <input name="menu" />
      <input name="estimate" />
      <input name="rate" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
