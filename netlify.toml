[build]
  publish = "dist"
  command = "npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# SPA fallback — only applies to GET requests
# POST requests to / are handled by Netlify Forms before this rule runs
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
  force  = false
